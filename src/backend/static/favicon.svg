<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#221f1f"/>
      <stop offset="100%" stop-color="#0e0e0e"/>
    </radialGradient>

    <!-- Crimson Glow & Accents -->
    <linearGradient id="netflix-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1A24"/>
      <stop offset="100%" stop-color="#B80009"/>
    </linearGradient>

    <linearGradient id="metal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5E5E5"/>
      <stop offset="100%" stop-color="#888888"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#E50914" stroke-width="6" opacity="0.4" />

  <!-- TV Antennas -->
  <line x1="256" y1="120" x2="150" y2="40" stroke="url(#metal-grad)" stroke-width="14" stroke-linecap="round" />
  <circle cx="150" cy="40" r="14" fill="#E50914" />
  <line x1="256" y1="120" x2="362" y2="40" stroke="url(#metal-grad)" stroke-width="14" stroke-linecap="round" />
  <circle cx="362" cy="40" r="14" fill="#E50914" />

  <!-- TV Monitor Body -->
  <rect x="76" y="110" width="360" height="290" rx="36" fill="#141414" stroke="url(#netflix-red)" stroke-width="16" filter="url(#glow)" />
  
  <!-- TV Screen Inner Area -->
  <rect x="100" y="134" width="280" height="242" rx="22" fill="#080808" />
  
  <!-- Subtle Retro TV Scanlines -->
  <line x1="100" y1="180" x2="380" y2="180" stroke="#ffffff" stroke-width="1" opacity="0.04" />
  <line x1="100" y1="230" x2="380" y2="230" stroke="#ffffff" stroke-width="1" opacity="0.04" />
  <line x1="100" y1="280" x2="380" y2="280" stroke="#ffffff" stroke-width="1" opacity="0.04" />
  <line x1="100" y1="330" x2="380" y2="330" stroke="#ffffff" stroke-width="1" opacity="0.04" />

  <!-- TV Controls / Dials (Right Panel) -->
  <circle cx="406" cy="180" r="14" fill="#262626" stroke="#404040" stroke-width="3" />
  <line x1="406" y1="172" x2="406" y2="188" stroke="#E50914" stroke-width="3" stroke-linecap="round" />
  <circle cx="406" cy="235" r="14" fill="#262626" stroke="#404040" stroke-width="3" />
  <line x1="398" y1="235" x2="414" y2="235" stroke="#E50914" stroke-width="3" stroke-linecap="round" />
  <rect x="396" y="285" width="20" height="65" rx="4" fill="#1c1c1c" />

  <!-- TV Stand -->
  <polygon points="216,400 296,400 326,460 186,460" fill="url(#metal-grad)" />
  <rect x="160" y="456" width="192" height="18" rx="9" fill="#2b2b2b" />

  <!-- PIRATE JOLLY ROGER EMBLEM (Inside Screen) -->
  <!-- Crossbones Behind Skull -->
  <g stroke="#E5E5E5" stroke-width="14" stroke-linecap="round">
    <line x1="165" y1="180" x2="315" y2="330" />
    <line x1="315" y1="180" x2="165" y2="330" />
  </g>
  <!-- Bone Knobs -->
  <circle cx="160" cy="175" r="8" fill="#E5E5E5" />
  <circle cx="170" cy="168" r="8" fill="#E5E5E5" />
  <circle cx="320" cy="175" r="8" fill="#E5E5E5" />
  <circle cx="310" cy="168" r="8" fill="#E5E5E5" />
  <circle cx="160" cy="335" r="8" fill="#E5E5E5" />
  <circle cx="170" cy="342" r="8" fill="#E5E5E5" />
  <circle cx="320" cy="335" r="8" fill="#E5E5E5" />
  <circle cx="310" cy="342" r="8" fill="#E5E5E5" />

  <!-- Pirate Skull Cranium -->
  <path d="M 190 240 C 190 190 290 190 290 240 C 290 262 278 275 268 285 L 268 300 C 268 304 262 308 256 308 L 224 308 C 218 308 212 304 212 300 L 212 285 C 202 275 190 262 190 240 Z" fill="#F0F0F0" />
  
  <!-- Pirate Hat / Bandana Top Accents (Netflix Red) -->
  <path d="M 188 230 C 210 200 270 200 292 230 C 285 220 195 220 188 230 Z" fill="#E50914" />
  
  <!-- Left Eye Socket -->
  <circle cx="218" cy="245" r="14" fill="#0E0E0E" />

  <!-- Pirate Eye Patch (Right Eye) -->
  <line x1="210" y1="215" x2="280" y2="275" stroke="#E50914" stroke-width="5" stroke-linecap="round" />
  <ellipse cx="262" cy="246" rx="16" ry="14" fill="#B80009" stroke="#E50914" stroke-width="3" />

  <!-- Skull Nose -->
  <polygon points="240,264 235,274 245,274" fill="#0E0E0E" />

  <!-- Skull Teeth Grid -->
  <line x1="222" y1="296" x2="258" y2="296" stroke="#0E0E0E" stroke-width="4" stroke-linecap="round" />
  <line x1="230" y1="290" x2="230" y2="302" stroke="#0E0E0E" stroke-width="3" />
  <line x1="240" y1="290" x2="240" y2="302" stroke="#0E0E0E" stroke-width="3" />
  <line x1="250" y1="290" x2="250" y2="302" stroke="#0E0E0E" stroke-width="3" />
</svg>
